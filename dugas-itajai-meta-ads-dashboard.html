<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Dugas Itajaí — Vendas Meta Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #15110d;
    --bg-radial: #1b1611;
    --surface: #1e1712;
    --surface-2: #241b14;
    --surface-hover: #2b2018;
    --line: #35281c;
    --line-soft: #2a2018;
    --accent: #fecc00;
    --accent-ink: #241b03;
    --accent-soft: rgba(254, 204, 0, 0.14);
    --accent-line: rgba(254, 204, 0, 0.35);
    --ink: #f8f2e4;
    --ink-dim: #cfc3ac;
    --ink-muted: #9d9080;
    --ink-faint: #6f6555;
    --good: #7bd88f;
    --bad: #ff8a75;
    --font-display: "Fredoka", "Trebuchet MS", sans-serif;
    --font-body: "Manrope", "Segoe UI", sans-serif;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 30px -18px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(254,204,0,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(254,204,0,0.06), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 60px;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Header ---------- */
  .header{
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 20px 26px;
    background: linear-gradient(160deg, var(--surface), var(--surface-2));
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  .logo-badge{
    width: 92px;
    height: 92px;
    flex: none;
    border-radius: 50%;
    overflow: hidden;
    border: 2.5px dashed rgba(255,255,255,0.35);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
  }
  .logo-badge img{ width: 100%; height: 100%; border-radius: 50%; display:block; object-fit: cover; }

  .header-text{ flex: 1 1 320px; min-width: 240px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }

  .eyebrow{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 34px;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
    color: var(--ink);
  }

  .header-meta{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex: none;
  }

  .period-pill{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .period-pill .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .updated-note{ font-size: 11px; color: var(--ink-faint); text-align: right; }

  /* ---------- Filter: calendar ---------- */
  .filter-panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 22px 20px;
    box-shadow: var(--shadow-card);
  }

  .filter-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .filter-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0;
  }

  .all-toggle{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink-dim);
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px 8px 12px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .all-toggle-icon{
    display: inline-flex;
    width: 16px; height: 16px;
    border-radius: 4px;
    background: var(--ink-faint);
    opacity: 0.5;
    flex: none;
  }
  .all-toggle:hover{ background: var(--surface-hover); color: var(--ink); border-color: var(--ink-faint); }
  .all-toggle.active{
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .all-toggle.active .all-toggle-icon{ background: var(--accent-ink); opacity: 0.75; }
  .all-toggle:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .calendar-row{
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .year-panel{
    flex: 1 1 230px;
    min-width: 210px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 14px 16px;
  }

  .year-panel-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 11px;
    padding: 0 2px;
  }

  .year-panel-head .year{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }

  .year-panel-head .year-count{
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .month-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .month-cell{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 11.5px;
    text-align: center;
    color: var(--ink-dim);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 9px 0;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .month-cell:hover{ background: var(--surface-hover); color: var(--ink); border-color: var(--ink-faint); }
  .month-cell:active{ transform: scale(0.94); }
  .month-cell.active{
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .month-cell.empty{
    color: var(--ink-faint);
    background: transparent;
    border: 1px dashed var(--line-soft);
    cursor: default;
    pointer-events: none;
    opacity: 0.5;
  }
  .month-cell:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- KPI grid ---------- */
  .kpi-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px){ .kpi-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .kpi-grid{ grid-template-columns: 1fr; } }

  .kpi-card{
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 17px 18px 16px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .kpi-card::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.85;
  }

  .kpi-label{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 9px;
  }

  .kpi-value{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 27px;
    color: var(--ink);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }

  .kpi-value .unit{ font-size: 15px; font-weight: 500; color: var(--ink-dim); margin-left: 3px; }

  .kpi-delta{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 9px;
    font-size: 12px;
    font-weight: 700;
  }
  .kpi-delta.up{ color: var(--good); }
  .kpi-delta.down{ color: var(--bad); }
  .kpi-delta.flat{ color: var(--ink-faint); }
  .kpi-delta .arrow{ font-size: 11px; }
  .kpi-delta-note{ color: var(--ink-faint); font-weight: 500; }

  /* ---------- Chart panels ---------- */
  .charts{
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .chart-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px 22px 14px;
    box-shadow: var(--shadow-card);
  }

  .chart-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .chart-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16.5px;
    color: var(--ink);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .chart-title .swatch{
    width: 10px; height: 10px; border-radius: 3px;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    flex: none;
  }

  .chart-current{
    font-size: 12.5px;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .chart-current b{ color: var(--accent); font-weight: 800; }

  .chart-svg-wrap{ position: relative; width: 100%; }
  .chart-svg-wrap svg{ display: block; width: 100%; height: auto; overflow: visible; }

  .axis-label{ font-family: var(--font-body); font-size: 10.5px; fill: var(--ink-faint); }
  .grid-line{ stroke: var(--line-soft); stroke-width: 1; }
  .baseline{ stroke: var(--line); stroke-width: 1; }
  .ref-line{ stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 4; }
  .ref-label{ font-family: var(--font-body); font-size: 9.5px; fill: var(--ink-faint); font-weight: 700; }

  .series-path{ fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .series-area{ fill: url(#areaGradient); opacity: 1; }
  .dot{ fill: var(--surface); stroke: var(--accent); stroke-width: 2.25; }
  .dot-hit{ fill: transparent; cursor: pointer; }
  .dot.selected{ fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
  .dot.hovered{ fill: var(--accent); }

  .value-label{ font-family: var(--font-body); font-weight: 800; font-size: 11.5px; fill: var(--ink); }

  .crosshair{ stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none; opacity: 0; }

  .tooltip{
    position: absolute;
    pointer-events: none;
    background: #0f0c09;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 12px;
    color: var(--ink);
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.7);
    opacity: 0;
    transform: translate(-50%, -110%);
    transition: opacity 0.1s ease;
    white-space: nowrap;
    z-index: 5;
  }
  .tooltip .t-month{ font-weight: 800; color: var(--accent); margin-bottom: 2px; display:block; }
  .tooltip .t-val{ font-weight: 700; }

  /* ---------- Footer ---------- */
  .footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 4px 6px 0;
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  .footer b{ color: var(--ink-muted); }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <div class="logo-badge"><img id="logoImg" src="" alt="Dugas Pizza Delivery" /></div>
    <div class="header-text">
      <p class="eyebrow">Meta Ads · Relatório de performance</p>
      <h1>Dugas Itajaí</h1>
    </div>
    <div class="header-meta">
      <span class="period-pill"><span class="dot"></span><span id="periodPillText">—</span></span>
      <span class="updated-note" id="updatedNote">—</span>
    </div>
  </header>

  <section class="filter-panel">
    <div class="filter-head">
      <p class="filter-label">Filtrar por mês</p>
      <button class="all-toggle active" id="allToggle" type="button">
        <span class="all-toggle-icon"></span>Período completo
      </button>
    </div>
    <div class="calendar-row" id="calendarRow"></div>
  </section>

  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="charts">

    <article class="chart-card">
      <div class="chart-head">
        <h2 class="chart-title"><span class="swatch"></span>Vendas</h2>
        <span class="chart-current" id="salesCurrent"></span>
      </div>
      <div class="chart-svg-wrap" id="chartSales"></div>
    </article>

    <article class="chart-card">
      <div class="chart-head">
        <h2 class="chart-title"><span class="swatch"></span>Valor das Vendas</h2>
        <span class="chart-current" id="valueCurrent"></span>
      </div>
      <div class="chart-svg-wrap" id="chartValue"></div>
    </article>

    <article class="chart-card">
      <div class="chart-head">
        <h2 class="chart-title"><span class="swatch"></span>ROAS</h2>
        <span class="chart-current" id="roasCurrent"></span>
      </div>
      <div class="chart-svg-wrap" id="chartRoas"></div>
    </article>

  </section>

  <footer class="footer">
    <span><b id="footCampaigns">—</b> campanhas de Vendas com “V4” no nome</span>
    <span>Fonte: Meta Ads — conta <b>CA - Dugas Itajaí</b></span>
    <span id="footGenerated">—</span>
  </footer>

</div>

  // ---------------------------------------------------------------
  // Formatting helpers
  // ---------------------------------------------------------------
  function fmtBRL(v){
    return "R$ " + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtBRLCompact(v){
    if (Math.abs(v) >= 1000){
      return "R$ " + (v/1000).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + "k";
    }
    return fmtBRL(v);
  }
  function fmtInt(v){ return Math.round(v).toLocaleString('pt-BR'); }
  function fmtRoas(v){ return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + "x"; }
  function fmtPct(v){
    var s = (v>=0?"+":"") + v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + "%";
    return s;
  }

  // ---------------------------------------------------------------
  // Aggregation for a given filter ("all" or a month key)
  // ---------------------------------------------------------------
  function aggregate(filterKey){
    var rows = filterKey === "all" ? MONTHS : MONTHS.filter(function(m){ return m.key === filterKey; });
    var spend = 0, purchases = 0, value = 0;
    rows.forEach(function(m){ spend += m.spend; purchases += m.purchases; value += m.value; });
    var roas = spend > 0 ? value/spend : 0;
    var ticket = purchases > 0 ? value/purchases : 0;
    var cpa = purchases > 0 ? spend/purchases : 0;
    return { spend: spend, purchases: purchases, value: value, roas: roas, ticket: ticket, cpa: cpa };
  }

  function prevMonthKey(key){
    var idx = MONTHS.findIndex(function(m){ return m.key === key; });
    if (idx <= 0) return null;
    return MONTHS[idx-1].key;
  }

  var calendarRow = document.getElementById('calendarRow');
  var allToggle = document.getElementById('allToggle');
  var currentFilter = "all";
  var MES_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function buildCalendar(){
    var years = [];
    MONTHS.forEach(function(m){
      var y = m.key.split('-')[0];
      if (years.indexOf(y) === -1) years.push(y);
    });

    years.forEach(function(y){
      var monthsInYear = MONTHS.filter(function(m){ return m.key.indexOf(y + '-') === 0; });

      var panel = document.createElement('div');
      panel.className = 'year-panel';
      panel.innerHTML =
        '<div class="year-panel-head"><span class="year">' + y + '</span>' +
        '<span class="year-count">' + monthsInYear.length + (monthsInYear.length === 1 ? ' mês' : ' meses') + '</span></div>';

      var grid = document.createElement('div');
      grid.className = 'month-grid';

      for (var mm = 1; mm <= 12; mm++){
        var mstr = (mm < 10 ? '0' : '') + mm;
        var key = y + '-' + mstr;
        var found = MONTHS.some(function(x){ return x.key === key; });
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.textContent = MES_ABBR[mm - 1];
        if (found){
          cell.className = 'month-cell';
          cell.dataset.key = key;
        } else {
          cell.className = 'month-cell empty';
          cell.disabled = true;
        }
        grid.appendChild(cell);
      }

      panel.appendChild(grid);
      calendarRow.appendChild(panel);
    });

    calendarRow.addEventListener('click', function(e){
      var btn = e.target.closest('.month-cell');
      if (!btn || btn.classList.contains('empty')) return;
      setFilter(btn.dataset.key);
    });

    allToggle.addEventListener('click', function(){ setFilter('all'); });
  }

  function setFilter(key){
    currentFilter = key;
    allToggle.classList.toggle('active', key === 'all');
    Array.prototype.forEach.call(calendarRow.querySelectorAll('.month-cell'), function(c){
      c.classList.toggle('active', c.dataset.key === key);
    });
    render();
  }

  var kpiGrid = document.getElementById('kpiGrid');

  var KPI_DEFS = [
    { key: 'spend', label: 'Investimento', fmt: fmtBRL, lowerIsBetter: true },
    { key: 'purchases', label: 'Vendas', fmt: fmtInt, lowerIsBetter: false },
    { key: 'value', label: 'Valor das Vendas', fmt: fmtBRL, lowerIsBetter: false },
    { key: 'roas', label: 'ROAS', fmt: fmtRoas, lowerIsBetter: false },

  ];

  function buildKpiCards(){
    KPI_DEFS.forEach(function(def){
      var card = document.createElement('div');
      card.className = 'kpi-card';
      card.innerHTML =
        '<p class="kpi-label">' + def.label + '</p>' +
        '<p class="kpi-value" id="kpi-' + def.key + '">—</p>' +
        '<div class="kpi-delta flat" id="kpi-delta-' + def.key + '"></div>';
      kpiGrid.appendChild(card);

  function renderKpis(){
    var current = aggregate(currentFilter);
    var prevKey = currentFilter === "all" ? null : prevMonthKey(currentFilter);
    var prev = prevKey ? aggregate(prevKey) : null;

    KPI_DEFS.forEach(function(def){
      var valEl = document.getElementById('kpi-' + def.key);
      valEl.textContent = def.fmt(current[def.key]);

      var deltaEl = document.getElementById('kpi-delta-' + def.key);
      if (!prev || prev[def.key] === 0){
        deltaEl.className = 'kpi-delta flat';
        deltaEl.innerHTML = '<span class="kpi-delta-note">' + (currentFilter === "all" ? "soma do período completo" : "sem mês anterior para comparar") + '</span>';
        return;
      }
      var diffPct = ((current[def.key] - prev[def.key]) / prev[def.key]) * 100;
      var isBetter = def.lowerIsBetter ? diffPct < 0 : diffPct > 0;
      var cls = Math.abs(diffPct) < 0.5 ? 'flat' : (isBetter ? 'up' : 'down');
      var arrow = diffPct > 0 ? '▲' : (diffPct < 0 ? '▼' : '—');
      deltaEl.className = 'kpi-delta ' + cls;
      deltaEl.innerHTML = '<span class="arrow">' + arrow + '</span>' + fmtPct(diffPct) + '<span class="kpi-delta-note">vs. ' + monthLabel(prevKey) + '</span>';
    });
  }

  function monthLabel(key){
    var m = MONTHS.find(function(x){ return x.key === key; });
    return m ? m.label : key;
  }

  // ---------------------------------------------------------------
  // Line chart builder (SVG), one series per chart
  // ---------------------------------------------------------------
  function buildLineChart(containerId, opts){
    var container = document.getElementById(containerId);
    var W = 1000, H = opts.height || 240;
    var padL = 54, padR = 18, padT = 18, padB = 40;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;

    var values = MONTHS.map(function(m){ return opts.accessor(m); });
    var maxV = Math.max.apply(null, values);
    var minV = Math.min(0, Math.min.apply(null, values));
    var niceMax = niceCeil(maxV);
    var niceMin = opts.allowNegative ? niceFloor(minV) : 0;

    function xFor(i){ return padL + (plotW * i / (MONTHS.length - 1)); }
    function yFor(v){ return padT + plotH - ((v - niceMin) / (niceMax - niceMin)) * plotH; }

    var pathD = MONTHS.map(function(m, i){
      return (i === 0 ? 'M' : 'L') + xFor(i).toFixed(2) + ',' + yFor(opts.accessor(m)).toFixed(2);
    }).join(' ');

    var areaD = pathD + ' L' + xFor(MONTHS.length-1).toFixed(2) + ',' + yFor(niceMin).toFixed(2) +
                ' L' + xFor(0).toFixed(2) + ',' + yFor(niceMin).toFixed(2) + ' Z';

    var gridCount = 4;
    var gridLines = '';
    var axisLabels = '';
    for (var g = 0; g <= gridCount; g++){
      var gv = niceMin + (niceMax - niceMin) * g / gridCount;
      var gy = yFor(gv);
      gridLines += '<line class="grid-line" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy.toFixed(2) + '" y2="' + gy.toFixed(2) + '"></line>';
      axisLabels += '<text class="axis-label" x="' + (padL - 10) + '" y="' + (gy + 3.5).toFixed(2) + '" text-anchor="end">' + opts.axisFmt(gv) + '</text>';
    }

    var xLabels = '';
    MONTHS.forEach(function(m, i){
      if (MONTHS.length > 10 && i % 2 !== 0 && i !== MONTHS.length - 1) return;
      var x = xFor(i);
      xLabels += '<text class="axis-label" x="' + x.toFixed(2) + '" y="' + (H - padB + 18) + '" text-anchor="middle">' + m.label + '</text>';
    });

    var refLine = '';
    if (opts.refValue !== undefined){
      var ry = yFor(opts.refValue);
      refLine = '<line class="ref-line" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + ry.toFixed(2) + '" y2="' + ry.toFixed(2) + '"></line>' +
                '<text class="ref-label" x="' + (W - padR) + '" y="' + (ry - 5).toFixed(2) + '" text-anchor="end">' + opts.refLabel + '</text>';
    }

    var dots = '';
    var lastIdx = MONTHS.length - 1;
    MONTHS.forEach(function(m, i){
      var x = xFor(i), y = yFor(opts.accessor(m));
      var isSelected = currentFilter === m.key;
      var isLast = i === lastIdx;
      var r = isSelected ? 6 : 3.5;
      var cls = 'dot' + (isSelected ? ' selected' : '');
      dots += '<circle class="' + cls + '" data-idx="' + i + '" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="' + r + '"></circle>';
      if (isSelected || isLast){
        var labelText = opts.pointFmt(opts.accessor(m));
        var anchor = i === lastIdx ? 'end' : 'middle';
        var lx = i === lastIdx ? x - 4 : x;
        dots += '<text class="value-label" x="' + lx.toFixed(2) + '" y="' + (y - 12).toFixed(2) + '" text-anchor="' + anchor + '">' + labelText + '</text>';
      }
      dots += '<circle class="dot-hit" data-idx="' + i + '" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="14"></circle>';
    });

    var svg =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + opts.ariaLabel + '">' +
        '<defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"></stop>' +
          '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"></stop>' +
        '</linearGradient></defs>' +
        gridLines +
        '<line class="baseline" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yFor(niceMin).toFixed(2) + '" y2="' + yFor(niceMin).toFixed(2) + '"></line>' +
        refLine +
        '<path class="series-area" d="' + areaD + '"></path>' +
        '<path class="series-path" d="' + pathD + '"></path>' +
        dots +
        axisLabels +
        xLabels +
        '<line class="crosshair" id="crosshair-' + containerId + '" y1="' + padT + '" y2="' + (H - padB) + '"></line>' +
      '</svg>';

    container.innerHTML = svg;

    var tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    container.appendChild(tooltip);

    var svgEl = container.querySelector('svg');
    var crosshair = container.querySelector('#crosshair-' + containerId);

    function showTooltip(i, evt){
      var m = MONTHS[i];
      var x = xFor(i), y = yFor(opts.accessor(m));
      var rect = svgEl.getBoundingClientRect();
      var scale = rect.width / W;
      var pxX = rect.left - container.getBoundingClientRect().left + x * scale;
      var pxY = rect.top - container.getBoundingClientRect().top + y * scale;
      tooltip.style.left = pxX + 'px';
      tooltip.style.top = pxY + 'px';
      tooltip.innerHTML = '<span class="t-month">' + m.label + '</span><span class="t-val">' + opts.tooltipFmt(opts.accessor(m)) + '</span>';
      tooltip.style.opacity = 1;
      crosshair.setAttribute('x1', x); crosshair.setAttribute('x2', x);
      crosshair.style.opacity = 1;
      svgEl.querySelectorAll('.dot').forEach(function(d){ d.classList.remove('hovered'); });
      var thisDot = svgEl.querySelector('.dot[data-idx="' + i + '"]');
      if (thisDot) thisDot.classList.add('hovered');
    }
    function hideTooltip(){
      tooltip.style.opacity = 0;
      crosshair.style.opacity = 0;
      svgEl.querySelectorAll('.dot').forEach(function(d){ d.classList.remove('hovered'); });
    }

    svgEl.querySelectorAll('.dot-hit').forEach(function(hit){
      hit.addEventListener('mouseenter', function(){ showTooltip(parseInt(hit.dataset.idx, 10)); });
      hit.addEventListener('mouseleave', hideTooltip);
      hit.addEventListener('click', function(){
        var key = MONTHS[parseInt(hit.dataset.idx, 10)].key;
        setFilter(key);
      });
    });
  }

  function niceCeil(v){
    if (v <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var norm = v / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return step * mag;
  }
  function niceFloor(v){
    if (v >= 0) return 0;
    return -niceCeil(-v);
  }

  // ---------------------------------------------------------------
  // Render pass
  // ---------------------------------------------------------------
  function render(){
    renderKpis();

    buildLineChart('chartSales', {
      accessor: function(m){ return m.purchases; },
      axisFmt: function(v){ return fmtInt(v); },
      pointFmt: function(v){ return fmtInt(v); },
      tooltipFmt: function(v){ return fmtInt(v) + ' vendas'; },
      ariaLabel: 'Vendas por mês'
    });

    buildLineChart('chartValue', {
      accessor: function(m){ return m.value; },
      axisFmt: function(v){ return fmtBRLCompact(v); },
      pointFmt: function(v){ return fmtBRLCompact(v); },
      tooltipFmt: function(v){ return fmtBRL(v); },
      ariaLabel: 'Valor das vendas por mês'
    });

    buildLineChart('chartRoas', {
      accessor: function(m){ return m.roas; },
      axisFmt: function(v){ return v.toLocaleString('pt-BR', {maximumFractionDigits:1}) + 'x'; },
      pointFmt: function(v){ return fmtRoas(v); },
      tooltipFmt: function(v){ return fmtRoas(v); },
      ariaLabel: 'ROAS por mês',
      refValue: 1,
      refLabel: 'equilíbrio (1x)'
    });

    var current = aggregate(currentFilter);
    var scopeLabel = currentFilter === 'all' ? 'período completo' : monthLabel(currentFilter);
    document.getElementById('salesCurrent').innerHTML = scopeLabel + ': <b style="color:var(--accent)">' + fmtInt(current.purchases) + '</b> vendas';
    document.getElementById('valueCurrent').innerHTML = scopeLabel + ': <b style="color:var(--accent)">' + fmtBRL(current.value) + '</b>';
    document.getElementById('roasCurrent').innerHTML = scopeLabel + ': <b style="color:var(--accent)">' + fmtRoas(current.roas) + '</b>';
  }

  // ---------------------------------------------------------------
  // Static header/footer info
  // ---------------------------------------------------------------
  function init(){
    buildCalendar();
    buildKpiCards();

    var first = MONTHS[0], last = MONTHS[MONTHS.length - 1];
    document.getElementById('periodPillText').textContent = first.label + ' — ' + last.label;
    document.getElementById('updatedNote').textContent = 'Dados até 28/08/2026 · ' + last.label + ' em andamento';
    document.getElementById('footCampaigns').textContent = CAMPAIGN_COUNT;
    document.getElementById('footGenerated').textContent = 'Gerado em ' + GENERATED_AT;

    render();
  }

  init();

})();
</script>
